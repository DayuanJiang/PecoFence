# Link the MSVC C runtime statically so the executables do not depend on the Visual C++
# Redistributable (VCRUNTIME140.dll). The Microsoft Store rejects undisclosed runtime
# dependencies (policy 10.2.4.1), and portable users no longer need the redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
