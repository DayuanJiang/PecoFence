<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webdrag</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
  <div class="zones">
    <div id="z1" data-zone="z1">z1</div><div id="z2" data-zone="z2">z2</div>
  </div>
  <div class="drags">
    <a id="ok" href="https://example.com/page">example.com</a>
    <a id="no" href="https://other.org/">other.org</a>
    <span id="txt" draggable="true">a text</span>
    <img id="pic" src="pic.png" alt="pic">
    <span id="card" draggable="true">a card</span>
  </div>
  <pre id="out">ready</pre>
</body>
</html>
