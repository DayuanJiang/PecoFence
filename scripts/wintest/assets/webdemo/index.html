<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>webdemo</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <h1>网页插件 Web plugin</h1>
  </header>
  <p class="lead">这一页由插件自己的网页画出，下面是栅栏的玻璃。</p>
  <div class="row">
    <button id="btn" type="button">现在几点</button>
    <span id="out">还没点过</span>
  </div>
  <div class="row">
    <button id="open" type="button">打开网页</button>
    <span id="nomenu">这里右键没有菜单</span>
  </div>
  <input id="box" type="text" placeholder="在这里打字 Type here" autocomplete="off">
  <ul id="list" tabindex="-1"></ul>
</body>
</html>
