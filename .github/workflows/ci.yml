name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bindings are up to date
        run: |
          cargo run -p tool_bindgen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- crates/platform/src/bindings.rs crates/render/src/comp.rs crates/render/src/gpu_bindings.rs
      - name: Translation coverage
        run: python scripts/check-locales.py
      - name: README translations
        run: python scripts/check-readme-translations.py
      - name: Website builds
        run: python scripts/build-site.py --out .cache/site-check
      - name: Test (core)
        run: cargo test --workspace
      - name: Release build
        run: |
          cargo build --locked --release -p pecofence -p pecofence-watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Separate invocation so the CLI's schemars feature is not unified into the app.
          cargo build --locked --release -p pecofence-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Size gate (pecofence.exe <= 3.5 MB)
        shell: pwsh
        run: |
          $size = (Get-Item target/release/pecofence.exe).Length
          Write-Output "pecofence.exe = $size bytes"
          if ($size -gt 3.5MB) { throw "binary too large" }
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/setup-inno-ci.ps1
      - name: Package
        shell: pwsh
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/make-windows.ps1 -SkipBuild -TargetDir target -Repository $env:PACKAGE_REPOSITORY
      - name: Package and installer smoke tests
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: python scripts/test-windows-packaging.py --target-dir target --repository "$env:PACKAGE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: pecofence-windows
          if-no-files-found: error
          path: |
            dist/pecofence-v*-x64-portable.zip
            dist/pecofence-v*-x64-portable.zip.sha256
            dist/pecofence-v*-x64-setup.exe
            dist/pecofence-v*-x64-setup.exe.sha256
