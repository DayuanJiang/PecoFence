name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match Cargo.toml version" }
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-locales.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-readme-translations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/setup-inno-ci.ps1
      - name: Package
        shell: pwsh
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/make-windows.ps1 -Repository $env:PACKAGE_REPOSITORY
      - name: Package and installer smoke tests
        env:
          PACKAGE_REPOSITORY: ${{ github.repository }}
        run: python scripts/test-windows-packaging.py --repository "$env:PACKAGE_REPOSITORY"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $base = "dist/pecofence-$env:GITHUB_REF_NAME-x64"
          $assets = @("$base-portable.zip", "$base-portable.zip.sha256", "$base-setup.exe", "$base-setup.exe.sha256")
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "PecoFence $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
