<footer class="footer container">
  <div class="footer-top">
    <a class="brand" href="{{home}}#top"><img src="{{root}}assets/mark.svg?v={{v}}" alt="" width="27" height="27"><span>PecoFence<span class="brand-dot">.</span></span></a>
    <ul class="footer-links">
      <li><a href="{{manual}}">{{t:nav.manual}}</a></li>
      <li><a href="{{repository}}">{{t:footer.source}}</a></li>
      <li><a href="{{docs}}/README.md">{{t:footer.docs}}</a></li>
      <li><a href="{{repository}}/issues">{{t:footer.issues}}</a></li>
      <li><a href="{{repository}}/blob/main/CONTRIBUTING.md">{{t:footer.contribute}}</a></li>
      <li><a href="{{repository}}/blob/main/LICENSE">{{t:footer.license}}</a></li>
      <li><a href="{{repository}}/blob/main/third_party/README.md">{{t:footer.notices}}</a></li>
      <li><a href="{{signing_policy}}">Code signing policy</a></li>
    </ul>
  </div>
  <p class="small">© {{year}} {{t:footer.copyright}}</p>
</footer>
