[package]
name = "pecofence"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PecoFence: group your desktop icons into glass fences on Windows 11."
build = "build.rs"

[[bin]]
name = "pecofence"
path = "src/main.rs"

[dependencies]
windows-core = { workspace = true }
windows-webview = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pecofence-core = { path = "../core" }
pecofence-ipc = { path = "../ipc" }
pecofence-platform = { path = "../platform" }
pecofence-render = { path = "../render" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
