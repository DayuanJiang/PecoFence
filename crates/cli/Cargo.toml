[package]
name = "pecofence-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PecoFence command-line control for terminals and coding agents."
build = "build.rs"

[[bin]]
name = "pecofence-cli"
path = "src/main.rs"

[dependencies]
pecofence-core = { path = "../core" }
pecofence-ipc = { path = "../ipc", features = ["describe"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# The user's SID for the pipe name (client.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[lints]
workspace = true
