[package]
name = "pecofence-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pecofence-core = { path = "../core" }
windows-core = { workspace = true }
windows-numerics = { workspace = true }
# IAsyncOperation for the Microsoft Store rating dialog (store.rs).
windows-future = "0.100"
# TimeSpan and DateTime of the media session (media.rs).
windows-time = "0.100"
# The dirty regions of a captured frame (capture.rs).
windows-collections = "0.100"
tracing = { workspace = true }

[dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
